name: Build and validate application

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project and resolve dependencies
        run: |
          xcodegen generate --spec project.yml
          xcodebuild -resolvePackageDependencies -project DopeStore.xcodeproj -scheme DopeStore
      - name: Compile for generic iOS device
        run: |
          xcodebuild build \
            -project DopeStore.xcodeproj \
            -scheme DopeStore \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
      - name: Check compatibility settings
        run: ./scripts/check-compatibility.sh
